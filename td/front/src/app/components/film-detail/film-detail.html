@if (film$ | async; as film){
  <h1>{{film.titre}}</h1>
  <a>realisateur : {{film.realisateur}}</a><br>
  <a>genre : {{film.genre}}</a><br>
  <a>date de sortie : {{film.dateSortie | date:"dd/MM/yyyy"}}</a><br>
  <a>acteurs : </a><br>
  <app-acteur-make-list [acteurs]="film.acteurs"/>
  <button (click)="modifier = true">Modifier</button>
  <button (click)="supprimer = true">Supprimer</button>
  <button (click)="acteursEdit = true">Editer les acteurs</button>

  @if (modifier){
    <app-film-formulaire [filminput]="film" (nuewFilm)="filmUpdated($event); this.modifier = false;"/>
  }

  @if (supprimer){
    <app-suppression-confirmation (confirm)="suppression($event)"/>
  }

  @if (acteursEdit){
    <app-film-acteur-edit [film]="film" (close)="acteursEdit = false" (nuewFilm)="filmUpdated($event)"/>
  }

} @else {
  <h1>Une erreur est survenue</h1>
}
