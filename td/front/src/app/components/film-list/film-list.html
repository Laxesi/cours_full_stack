<h1>La liste des films</h1>
@if (films$ | async; as films){
  <app-film-make-list [films]="films"/>
  <button (click)="ajouter = true">Ajouter un film</button>

  @if (ajouter){
    <app-film-formulaire (nuewFilm)="filmsUpdated($event, films)"/>
  }

} @else {
  <h1>Une erreur c'est produite</h1>
}
